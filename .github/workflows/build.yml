name: Test and Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install Busted
        run: luarocks install busted

      - name: Install LuaCov
        run: luarocks install luacov

      - name: Run tests
        run: busted --coverage tests

      - name: Generate coverage report
        run: luacov

      - name: Display coverage summary
        run: cat luacov.report.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./luacov.report.out
          fail_ci_if_error: false

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # repo.json decides the version: add a new entry there to release it
      - name: Read version from repo.json
        id: version
        run: |
          version=$(jq -r '.[0].Versions[].Version' repo.json | sort -V | tail -1)
          echo "Newest version in repo.json: $version"

          # the entry's Url must point at the tag this job creates
          url=$(jq -r --arg v "$version" '.[0].Versions[] | select(.Version == $v) | .Url' repo.json)
          case "$url" in
            */archive/$version.zip) ;;
            *) echo "::error::Url for $version in repo.json does not end in /archive/$version.zip: $url"; exit 1 ;;
          esac

          if git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then
            echo "Tag $version already exists, skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Tag $version does not exist, releasing"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Create zip package
        if: steps.version.outputs.should_release == 'true'
        run: zip -R lspClient.zip '*.lua' 'repo.json' 'help/*'

      - name: Upload zip artifact
        if: steps.version.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lspClient-package
          path: lspClient.zip

      - name: Create release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: lspClient.zip
          generate_release_notes: true
